name: Pulse
options:
  bundleIdPrefix: com.huangsunquan
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug-Internal: debug
  Release-Internal: release
  Debug-Public: debug
  Release-Public: release
configFiles:
  Debug-Internal: xcconfig/Pulse-Internal.xcconfig
  Release-Internal: xcconfig/Pulse-Internal.xcconfig
  Debug-Public: xcconfig/Pulse-Public.xcconfig
  Release-Public: xcconfig/Pulse-Public.xcconfig
targets:
  Pulse:
    type: application
    platform: macOS
    sources:
      - path: Pulse
    settings:
      base:
        ENABLE_PREVIEWS: YES
  PulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PulseTests
    dependencies:
      - target: Pulse
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseTests: [test]
